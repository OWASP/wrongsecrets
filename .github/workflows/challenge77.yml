name: "Get the challenge code 77"

# Challenge 77: a "secret" that survives forking. GitHub does not copy repository secrets to forks,
# so this workflow ships the secret encrypted and keeps the decryption key right next to it.
# Anyone who forks the repository gets both, and can run this workflow (or openssl) to decrypt it.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  decrypt:
    name: decrypt the forkable secret
    runs-on: ubuntu-latest
    env:
      CHALLENGE_77_CIPHERTEXT: "XbHaDIdaxp2qQxtTY+bgh7w0pOA/ZZ007P//8FO29pOjIaSKMisnRajNDz20XMo04cacu6gIK05BYHiJtUUnFg=="
      CHALLENGE_77_KEY: "8fa2807c0391c43fb804d8c00a6267f486c0201492f85d668390100b4463cdc5"
      CHALLENGE_77_IV: "38242bf02823f7fd9557b2570e97c1c1"
    steps:
      - name: Decrypt the secret
        shell: bash
        run: |
          echo "The secret is: $(echo "${CHALLENGE_77_CIPHERTEXT}" | openssl enc -d -aes-256-cbc -K "${CHALLENGE_77_KEY}" -iv "${CHALLENGE_77_IV}" -a -A)"
