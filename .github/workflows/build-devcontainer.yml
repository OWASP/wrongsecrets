name: Build Dev Container

on:
  push:
    branches:
      - master
    paths:
      - ".devcontainer/Dockerfile"
      - ".devcontainer/devcontainer.json"
      - ".github/workflows/build-devcontainer.yml"

  pull_request:
    paths:
      - ".devcontainer/Dockerfile"
      - ".devcontainer/devcontainer.json"
      - ".github/workflows/build-devcontainer.yml"

  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/owasp/wrongsecrets-devcontainer

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest

          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=26-resolute
            type=sha

      - name: Build and push architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile

          platforms: ${{ matrix.platform }}

          push: ${{ github.event_name != 'pull_request' }}

          tags: |
            ${{ env.IMAGE_NAME }}:${{ matrix.arch }}-${{ github.sha }}

          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha,scope=devcontainer-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=devcontainer-${{ matrix.arch }}

      - name: Pull image for scanning
        if: github.event_name != 'pull_request'
        run: |
          docker pull "${IMAGE_NAME}:${{ matrix.arch }}-${{ github.sha }}"

      - name: Scan image
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ matrix.arch }}-${{ github.sha }}"
          format: sarif
          output: "trivy-${{ matrix.arch }}.sarif"
          severity: CRITICAL,HIGH

      - name: Upload scan results
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-${{ matrix.arch }}.sarif"

  manifest:
    name: Create multi-arch manifest
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:26-resolute" \
            --tag "${IMAGE_NAME}:${GITHUB_SHA}" \
            "${IMAGE_NAME}:amd64-${GITHUB_SHA}" \
            "${IMAGE_NAME}:arm64-${GITHUB_SHA}"
