name: Build and Publish LLaMA Containers

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

jobs:
  build-and-publish-desktop:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        container:
          - name: "llamaserver"
            dockerfile: "Dockerfile_llamaserver1"
            image_name: "wrongsecrets-llamaserver"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.container.image_name }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest-master
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          file: ${{ matrix.container.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.container.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.container.name }}

      - name: Verify Docker image was built
        run: |
          echo "Verifying Docker image was built successfully..."
          echo "Container: ${{ matrix.container.name }}"
          echo "Dockerfile: ${{ matrix.container.dockerfile }}"
          echo "Image tags: ${{ steps.meta.outputs.tags }}"
          echo "Image digest: ${{ steps.build.outputs.digest }}"

  create-summary:
    runs-on: ubuntu-latest
    needs: build-and-publish-desktop
    steps:
      - name: Create Release Summary
        run: |
          echo "## 🦙 LLaMA Containers Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**📦 Container Images Published:**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository }}/wrongsecrets-llamaserver:latest-master\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**🐳 Try the desktop environments:**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Standard LLaMA Server:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/${{ github.repository }}/wrongsecrets-llamaserver:latest-master" >> $GITHUB_STEP_SUMMARY
          echo "docker run -d -p 1234:1234 ghcr.io/${{ github.repository }}/wrongsecrets-llamaserver:latest-master" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Then visit: http://localhost:1234" >> $GITHUB_STEP_SUMMARY
