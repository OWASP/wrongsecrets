apiVersion: apps/v1
kind: Deployment
metadata:
  name: wrongsecrets-llama
  labels:
    app: wrongsecrets-llama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wrongsecrets-llama
  template:
    metadata:
      labels:
        app: wrongsecrets-llama
    spec:
      containers:
        - name: llama-server
          image: ghcr.io/owasp/wrongsecrets-llama:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 1234
              protocol: TCP

          args:
            - "-m"
            - "/models/model.gguf"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "1234"
            - "-c"
            - "256"
            - "-n"
            - "64"
            - "-np"
            - "1"
            - "--temp"
            - "0.1"

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: wrongsecrets-llama
  labels:
    app: wrongsecrets-llama
spec:
  type: ClusterIP
  selector:
    app: wrongsecrets-llama
  ports:
    - name: http
      port: 1234
      targetPort: http
      protocol: TCP
