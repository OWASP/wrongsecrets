apiVersion: apps/v1
kind: Deployment
metadata:
  name: challenge74-llama
  labels:
    app: challenge74-llama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: challenge74-llama
  template:
    metadata:
      labels:
        app: challenge74-llama
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: llama-server
          image: ghcr.io/owasp/wrongsecrets/wrongsecrets-llamaserver-pr:pr-2692
          imagePullPolicy: Always

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          ports:
            - name: http
              containerPort: 1234
              protocol: TCP

          startupProbe:
            httpGet:
              path: /v1/models
              port: http
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /v1/models
              port: http
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /v1/models
              port: http
              scheme: HTTP
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
